[project]
name = "eccm-mrtm"
version = "0.1.0"
description = "ECCM - MRTM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numba",
    "numpy>=2.3.1",
    "scipy>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eccm_mrtm"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest",
]
